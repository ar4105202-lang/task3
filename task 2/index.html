<!DOCTYPE html>
<html lang="en" dir="rtl">
<head>
    <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>بيانات المستخدم</title>
</head>
<body>
    <div class="card">
        <h1>ادخل بياناتك</h1>
        <form id="userForm" novalidate>
            <label for="name">الاسم</label>
            <input type="text" id="name" placeholder="أكتب اسمك">
            <div class="error" id="nameError"></div>

            <label for="age"> العمر</label>
            <input type="number" id="age" placeholder="العمر">
            <div class="error" id="ageError"></div>

            <label for="email">الايميل</label>
            <input type="email" id="email" placeholder="الايميل الخاص بك">
            <div class="error" id="emailError"></div>

            <label for="address">العنوان </label>
            <input type="text" id="address" placeholder="ادخل العنوان ">
            <div class="error" id="addressError"></div>

            <button type="submit">حفظ</button>


        </form>

        <div id="result"></div>


    </div>


    <script src="./js/main.js"></script>
</body>
</html>
